<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindIt - Dattakala Group of Institutions</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        /* HEADER */
        header {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            text-align: center;
        }

        header h1 {
            font-size: 22px;
        }

        /* LOGIN */
        #loginSection {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }

        .login-box {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* MAIN */
        #mainSection {
            display: none;
            padding: 20px;
        }

        .form-box {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .form-box input,
        .form-box textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .form-box button {
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            color: black;
            padding: 15px;
            border-radius: 15px;
        }

        .card button {
            margin-top: 10px;
            background: #ff9800;
            border: none;
            color: white;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* CHAT BOX */
        .chat-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: white;
            color: black;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: none;
            flex-direction: column;
        }

        .chat-header {
            background: #667eea;
            color: white;
            padding: 10px;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }

        .chat-messages {
            height: 200px;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-input {
            display: flex;
        }

        .chat-input input {
            flex: 1;
            padding: 8px;
            border: none;
            border-top: 1px solid #ccc;
        }

        .chat-input button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px;
        }

        .message {
            margin: 5px 0;
            padding: 6px 10px;
            border-radius: 10px;
            max-width: 70%;
        }

        .sent {
            background: #667eea;
            color: white;
            margin-left: auto;
        }

        .received {
            background: #e4e6eb;
        }
    </style>
</head>

<body>

    <header>
        <h1>Dattakala Group of Institutions - FindIt Portal</h1>
    </header>

    <section id="loginSection">
        <div class="login-box">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Enter your name">
            <button onclick="login()">Login</button>
        </div>
    </section>

    <section id="mainSection">

        <div class="form-box">
            <h2>Report Lost Item</h2>
            <input type="text" id="itemName" placeholder="Item Name">
            <textarea id="itemDesc" placeholder="Description"></textarea>
            <button onclick="addItem()">Post Item</button>
        </div>

        <div class="cards" id="itemList"></div>

    </section>

    <!-- CHAT -->
    <div class="chat-box" id="chatBox">
        <div class="chat-header">Chat</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Type message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let currentUser = "";
        let currentChatItem = "";

        function login() {
            currentUser = document.getElementById("username").value;
            if (currentUser == "") {
                alert("Enter name");
                return;
            }
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("mainSection").style.display = "block";
        }

        function addItem() {
            let name = document.getElementById("itemName").value;
            let desc = document.getElementById("itemDesc").value;

            let card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
<h3>${name}</h3>
<p>${desc}</p>
<button onclick="openChat('${name}')">I Found This</button>
`;

            document.getElementById("itemList").appendChild(card);

            document.getElementById("itemName").value = "";
            document.getElementById("itemDesc").value = "";
        }

        function openChat(item) {
            currentChatItem = item;
            document.getElementById("chatBox").style.display = "flex";
            document.querySelector(".chat-header").innerText = "Chat about: " + item;
            document.getElementById("chatMessages").innerHTML = "";
        }

        function sendMessage() {
            let input = document.getElementById("chatInput");
            if (input.value == "") return;

            let msg = document.createElement("div");
            msg.className = "message sent";
            msg.innerText = input.value;

            document.getElementById("chatMessages").appendChild(msg);
            input.value = "";
            document.getElementById("chatMessages").scrollTop = 9999;
        }
    </script>

</body>

</html>
